<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dog Breed Fetcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-card">
    <h1>Dog Breed Fetcher</h1>
    <select id="breedSelect" aria-label="Select dog breed">
      <option value="">Select Breed</option>
    </select>

    <div class="image-box" id="imageBox">
      <p id="message">Pumili ng breed sa taas</p>
      <img id="dogImage" alt="Random dog">
    </div>

    <button id="fetchButton" disabled>Fetch Again</button>
  </main>
  <script src="script.js"></script>
</body>
</html>
